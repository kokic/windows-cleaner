[package]
name = "windows-cleaner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wmc" # Windows Move Cleaner
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true
